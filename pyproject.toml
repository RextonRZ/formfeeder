[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formfeeder"
version = "0.1.0"
description = "Self-configuring Google Form auto-responder powered by Gemini 2.5 Flash"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.27.0",
]

[project.scripts]
formfeeder = "formfeeder.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["formfeeder*"]
